name: CI

# The README makes two claims a reader cannot check without running the project:
# that the pipeline is reproducible, and that the tests pass. This workflow checks
# both, on every push, so the claims are verified rather than asserted.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded push does not need to finish; cancel it and free the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint Python sources
        run: python -m ruff check src dashboard tests tools

      # The dashboard render tests skip themselves when the pipeline has not run,
      # so this step is what makes the full suite meaningful rather than partial.
      - name: Run the pipeline
        run: python src/run_pipeline.py

      - name: Run the tests
        run: python -m pytest tests/ -q

      # The notebooks are committed artefacts, and test_notebooks.py checks that the
      # committed ones are populated and stable. This step answers the other question a
      # reader cannot: do they still *run* against the current code? A notebook that no
      # longer executes is invisible on GitHub, because the stale outputs still render.
      #
      # Deliberately after the tests, so they inspect the committed files rather than a
      # fresh build. The rebuild is not compared byte for byte: the embedded charts are
      # rendered with whatever CJK font the runner has, so their PNG bytes legitimately
      # differ from the macOS ones. Only reports/ is held to that standard.
      - name: Rebuild the notebooks
        if: matrix.python-version == '3.11'
        run: python tools/build_notebooks.py

      # The README says two consecutive runs produce byte-identical reports under
      # outputs/reports/, and that tests/test_reproducibility.py enforces it. That
      # test covers the generator across processes; this covers the whole pipeline
      # end to end, on a different operating system from the one it was built on.
      - name: Check the pipeline is reproducible
        if: matrix.python-version == '3.11'
        run: |
          cp -r outputs/reports /tmp/reports-first-run
          python src/run_pipeline.py
          if diff -r /tmp/reports-first-run outputs/reports; then
            echo "Reports are byte-identical across two runs."
          else
            echo "::error::The pipeline is not reproducible: reports changed between runs."
            exit 1
          fi

      - name: Summarise the run
        if: matrix.python-version == '3.11'
        run: |
          python tools/ci_summary.py --output summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
